<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Xavi Profile Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered rounded card on a black starfield; drag tilts the avatar, scroll zooms. */
:root{--bg:#000;--fg:#f2f2f2;--mute:#6f6f6f;--line:#242424;--card:#050505;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stars{position:fixed;inset:0;width:100%;height:100%}
.clock{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-size:10px;letter-spacing:.12em;color:var(--mute)}
.nav{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:11px;letter-spacing:.1em;background:#0b0b0b}
.stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1100px;touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.card{width:min(260px,72vw);aspect-ratio:3/4.4;border:1px solid var(--line);border-radius:26px;background:radial-gradient(120% 80% at 50% 30%,#0e0e0e,var(--card));position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:0 0 20px;transform-style:preserve-3d;will-change:transform}
.avatar{position:absolute;left:50%;top:7%;width:78%;transform:translateZ(50px) translateX(-50%);filter:drop-shadow(0 18px 24px rgba(0,0,0,.8));-webkit-user-drag:none;user-select:none;pointer-events:none}
.name{font-size:13px;letter-spacing:.14em;transform:translateZ(30px)}
.icons{display:flex;gap:16px;transform:translateZ(30px);position:relative;z-index:5}
.icons a{display:grid;place-items:center;width:40px;height:40px;cursor:pointer;color:var(--fg);opacity:.85;border-radius:8px}
.icons a:hover,.icons a:focus-visible{opacity:1;outline:1px solid var(--mute)}
.icons svg{width:16px;height:16px;fill:currentColor}
.hint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.1em;color:var(--mute)}
</style>

<script>
(function(){
  var cv=document.getElementById('stars'),cx=cv.getContext('2d'),S=[];
  function size(){cv.width=innerWidth;cv.height=innerHeight;S=[];for(var i=0;i<140;i++)S.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.1+.2,a:Math.random()*.6+.15,p:Math.random()*6.28})}
  size();addEventListener('resize',size);
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(t){cx.clearRect(0,0,cv.width,cv.height);S.forEach(function(s){var a=s.a*(still?1:.7+.3*Math.sin(t/1400+s.p));cx.fillStyle='rgba(255,255,255,'+a+')';cx.fillRect(s.x,s.y,s.r,s.r)});if(!still)requestAnimationFrame(draw)}
  requestAnimationFrame(draw);
  function tick(){var d=new Date(),h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0');document.getElementById('clock').textContent=String(h).padStart(2,'0')+':'+m+' '+(d.getHours()<12?'AM':'PM')}
  tick();setInterval(tick,15000);
  var st=document.getElementById('stage'),card=document.getElementById('card');
  var ry=0,rx=0,vy=0,vx=0,zoom=1,down=false,lx=0,ly=0,t0=0;
  st.addEventListener('pointerdown',function(e){if(e.target.closest&&e.target.closest('.icons a'))return;down=true;lx=e.clientX;ly=e.clientY;st.classList.add('drag');st.setPointerCapture(e.pointerId)});
  st.addEventListener('pointermove',function(e){if(!down)return;vy=(e.clientX-lx)*.5;vx=-(e.clientY-ly)*.35;ry+=vy;rx+=vx;lx=e.clientX;ly=e.clientY});
  function up(){down=false;st.classList.remove('drag')}
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);

  function loop(t){

    requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
})();
